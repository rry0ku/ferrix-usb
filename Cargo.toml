[package]
name = "ferrix-usb"
version = "0.1.0"
edition = "2021"
description = "Offline vetting and verification tool for removable media"
readme = "README.md"
license = "GPL-3.0-or-later"
repository = "https://github.com/rry0ku/ferrix-usb"
homepage = "https://github.com/rry0ku/ferrix-usb"
documentation = "https://github.com/rry0ku/ferrix-usb"
keywords = ["usb", "security", "offline", "airgap", "badusb"]
categories = ["command-line-utilities", "security-tools"]

[lib]
name = "ferrix_usb"
path = "src/lib.rs"

[[bin]]
name = "ferrix"
path = "src/main.rs"

[dependencies]
blake3 = "1.5"
clap = { version = "4", features = ["derive"] }
gpt = "3.1"
mbrman = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "fast"] }
landlock = "0.4.7"
seccompiler = "0.5.0"
ratatui = "0.30.2"
crossterm = "0.29.0"
nix = { version = "0.29.0", features = ["user", "process"] }
libc = "0.2"
