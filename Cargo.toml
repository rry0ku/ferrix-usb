[package]
name = "ferrix-usb"
version = "0.1.0"
edition = "2021"
description = "Offline vetting and verification tool for removable media"
readme = "README.md"
license = "GPL-3.0-or-later"

[lib]
name = "ferrix_usb"
path = "src/lib.rs"

[[bin]]
name = "ferrix"
path = "src/main.rs"

[dependencies]
blake3 = "1.5"
clap = { version = "4", features = ["derive"] }
gpt = "3.1"
mbrman = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "fast"] }
